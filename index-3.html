<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Northwest Campus Hub</title>
<style>
:root{--ink:#10302f;--pine:#1d5c57;--mint:#e3efec;--chalk:#f8faf9;--gold:#e8a83a;--red:#b23a3a;--line:#cfdcd8}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--chalk);color:var(--ink)}
h1,h2,h3{font-family:Georgia,'Times New Roman',serif;line-height:1.2;margin:0 0 .5em}
h1{font-size:2rem}h2{font-size:1.4rem}h3{font-size:1.1rem}
a{color:var(--pine)}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea,select{width:100%;padding:.65rem .75rem;border:1.5px solid var(--line);border-radius:6px;background:#fff;margin:.25rem 0 .9rem}
input:focus,textarea:focus,select:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
label{font-weight:600;font-size:.9rem}
.btn{background:var(--pine);color:#fff;border:0;border-radius:6px;padding:.65rem 1.1rem;cursor:pointer;font-weight:600}
.btn:hover{background:var(--ink)}
.btn.alt{background:#fff;color:var(--pine);border:1.5px solid var(--pine)}
.btn.del{background:#fff;color:var(--red);border:1.5px solid var(--red)}
.btn.sm{padding:.35rem .7rem;font-size:.85rem}
.wrap{max-width:900px;margin:0 auto;padding:1rem}
.top{background:var(--ink);color:#fff}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.top h1{font-size:1.25rem;margin:0}
.top .who{display:flex;align-items:center;gap:.75rem;font-size:.9rem}
.login{max-width:400px;margin:8vh auto;padding:1.5rem;background:#fff;border:1.5px solid var(--line);border-radius:10px}
.seg{display:flex;gap:.5rem;margin-bottom:1rem}
.seg button{flex:1}
.tabs{display:flex;gap:.4rem;overflow-x:auto;padding:.75rem 0;border-bottom:2px solid var(--line);margin-bottom:1rem}
.tabs button{background:none;border:0;padding:.5rem .9rem;border-radius:6px;cursor:pointer;font-weight:600;white-space:nowrap}
.tabs button.on{background:var(--mint);color:var(--pine)}
.card{background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:1rem;margin-bottom:.8rem}
.doc{border-left:6px solid var(--gold)}
.row{display:flex;justify-content:space-between;align-items:center;gap:.75rem;flex-wrap:wrap}
.meta{font-size:.85rem;color:#4b6663}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.8rem;margin-bottom:1rem}
.stat{background:var(--mint);border-radius:8px;padding:1rem}
.stat b{display:block;font:700 2rem Georgia,serif}
.notice{background:#fff6e3;border:1.5px solid var(--gold);border-radius:8px;padding:.8rem 1rem;margin-bottom:1rem}
.filters{display:grid;grid-template-columns:2fr 1fr;gap:.6rem}
.empty{padding:1.5rem;text-align:center;color:#4b6663;border:1.5px dashed var(--line);border-radius:8px}
#toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.6rem 1rem;border-radius:6px;display:none;z-index:9}
@media(max-width:520px){.filters{grid-template-columns:1fr}h1{font-size:1.6rem}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<input type="file" id="imp" accept=".json" hidden>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u)?u:'#';
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>new Date().toISOString().slice(0,10);
const DEF={settings:{name:'Northwest Campus Hub',welcome:'Find your handouts and campus news here.',adminPass:'admin123'},students:[],handouts:[],announcements:[]};
const CFG={
  handouts:{one:'handout',fields:[['title','Title'],['subject','Subject'],['link','Google Drive link','url']]},
  students:{one:'student',fields:[['id','Student ID'],['name','Full name'],['pass','Password']]},
  announcements:{one:'announcement',fields:[['title','Title'],['body','Message','area']]}
};
let base=DEF,DB=DEF,role=sessionStorage.getItem('role'),mode='student',tab='dashboard',editing=null,q='',subj='';

async function init(){
  try{base=await (await fetch('data.json',{cache:'no-store'})).json()}catch(e){base=DEF}
  DB=base;
  if(role==='admin')useDraft();
  render();
}
function useDraft(){const d=localStorage.getItem('nwhub_draft');if(d){try{DB=JSON.parse(d)}catch(e){}}}
function hasDraft(){return !!localStorage.getItem('nwhub_draft')}
function save(){localStorage.setItem('nwhub_draft',JSON.stringify(DB));render()}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2500)}

function login(){
  const id=$('#lid')?.value.trim().toLowerCase(),pw=$('#lpw').value;
  if(mode==='admin'){
    let draftPass=null;try{draftPass=JSON.parse(localStorage.getItem('nwhub_draft')).settings.adminPass}catch(e){}
    if(pw===base.settings.adminPass||(draftPass&&pw===draftPass)){role='admin';sessionStorage.setItem('role',role);useDraft();tab='dashboard';return render()}
  }else{
    const s=base.students.find(s=>s.id.toLowerCase()===id&&s.pass===pw);
    if(s){role='s:'+s._id;sessionStorage.setItem('role',role);DB=base;return render()}
  }
  toast(mode==='admin'?'Wrong admin password.':'Student ID or password is wrong.');
}
function logout(){sessionStorage.removeItem('role');role=null;DB=base;render()}
function setMode(m){mode=m;render()}

function render(){
  const app=$('#app');
  if(!role){
    app.innerHTML=`<div class="login"><h1>${esc(base.settings.name)}</h1>
    <p class="meta">${esc(base.settings.welcome)}</p>
    <div class="seg"><button class="btn ${mode==='student'?'':'alt'}" onclick="setMode('student')">Student</button>
    <button class="btn ${mode==='admin'?'':'alt'}" onclick="setMode('admin')">Admin</button></div>
    ${mode==='student'?`<label for="lid">Student ID</label><input id="lid" autocomplete="username">`:''}
    <label for="lpw">${mode==='admin'?'Admin password':'Password'}</label>
    <input id="lpw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
    <button class="btn" style="width:100%" onclick="login()">Log in</button>
    ${mode==='student'?'<p class="meta">Accounts are created by your admin. There is no sign-up.</p>':''}</div>`;
    return;
  }
  const head=(who)=>`<div class="top"><div class="wrap"><h1>${esc(DB.settings.name)}</h1><div class="who">${who}<button class="btn alt sm" onclick="logout()">Log out</button></div></div></div>`;
  if(role==='admin'){
    const T=[['dashboard','Dashboard'],['handouts','Handouts'],['students','Students'],['announcements','Announcements'],['settings','Settings']];
    app.innerHTML=head('Admin')+`<div class="wrap"><div class="tabs">${T.map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';editing=null;render()">${l}</button>`).join('')}</div>${adminView()}</div>`;
  }else{
    const s=DB.students.find(s=>'s:'+s._id===role);
    if(!s)return logout();
    const subjects=[...new Set(DB.handouts.map(h=>h.subject))].sort();
    app.innerHTML=head('Hi, '+esc(s.name))+`<div class="wrap"><p>${esc(DB.settings.welcome)}</p>
    <h2>Announcements</h2>${DB.announcements.length?DB.announcements.map(a=>`<div class="card"><h3>${esc(a.title)}</h3><div>${esc(a.body)}</div><div class="meta">${esc(a.date)}</div></div>`).join(''):'<div class="empty">No announcements yet.</div>'}
    <h2 style="margin-top:1.5rem">Handouts</h2>
    <div class="filters"><input id="q" placeholder="Search handouts" value="${esc(q)}" oninput="q=this.value;list()">
    <select id="sj" onchange="subj=this.value;list()"><option value="">All subjects</option>${subjects.map(x=>`<option ${x===subj?'selected':''}>${esc(x)}</option>`).join('')}</select></div>
    <div id="hl"></div></div>`;
    list();
  }
}
function list(){
  const r=DB.handouts.filter(h=>(!subj||h.subject===subj)&&(h.title+h.subject).toLowerCase().includes(q.toLowerCase()));
  $('#hl').innerHTML=r.length?r.map(h=>`<div class="card doc row"><div><h3 style="margin:0">${esc(h.title)}</h3><div class="meta">${esc(h.subject)} · ${esc(h.date)}</div></div><a class="btn sm" style="text-decoration:none" href="${esc(safeUrl(h.link))}" target="_blank" rel="noopener">Open</a></div>`).join(''):'<div class="empty">No handouts match your search.</div>';
}

function adminView(){
  if(tab==='dashboard')return `<div class="stats"><div class="stat"><b>${DB.handouts.length}</b>Handouts</div><div class="stat"><b>${DB.students.length}</b>Students</div><div class="stat"><b>${DB.announcements.length}</b>Announcements</div></div>
  ${hasDraft()?`<div class="notice"><b>You have unpublished changes.</b> Students can't see them yet. Download data.json, then replace it in your GitHub repo and commit.<br><br><button class="btn sm" onclick="exportJSON()">Download data.json</button></div>`:'<div class="card">No unpublished changes. Add handouts, students or announcements from the tabs above.</div>'}
  <div class="card"><h3>How to publish changes</h3><ol><li>Make your changes here.</li><li>Tap <b>Download data.json</b>.</li><li>In GitHub, open your repo, upload data.json to replace the old one, and commit.</li><li>Vercel updates the site in about a minute.</li></ol></div>`;
  if(tab==='settings'){const s=DB.settings;return `<div class="card"><label>Site name</label><input id="s_name" value="${esc(s.name)}">
  <label>Welcome message</label><textarea id="s_welcome" rows="3">${esc(s.welcome)}</textarea>
  <label>Admin password</label><input id="s_pass" value="${esc(s.adminPass)}">
  <button class="btn" onclick="saveSettings()">Save settings</button></div>
  <div class="card"><h3>Data</h3><div class="row" style="justify-content:flex-start"><button class="btn sm" onclick="exportJSON()">Download data.json</button>
  <button class="btn alt sm" onclick="$('#imp').click()">Import data.json</button>
  <button class="btn del sm" onclick="discard()">Discard unpublished changes</button></div></div>`}
  const c=CFG[tab],e=editing?DB[tab].find(x=>x._id===editing):{};
  return `<div class="card"><h3>${editing?'Edit':'Add'} ${c.one}</h3>${c.fields.map(([f,l,t])=>`<label for="f_${f}">${l}</label>${t==='area'?`<textarea id="f_${f}" rows="4">${esc(e[f]||'')}</textarea>`:`<input id="f_${f}" ${t==='url'?'type="url" placeholder="https://drive.google.com/..."':''} value="${esc(e[f]||'')}">`}`).join('')}
  <button class="btn" onclick="saveItem('${tab}')">Save ${c.one}</button> ${editing?'<button class="btn alt" onclick="editing=null;render()">Cancel</button>':''}</div>
  <h2>All ${tab} (${DB[tab].length})</h2>
  ${DB[tab].length?DB[tab].map(x=>`<div class="card row"><div><b>${esc(x.title||x.name)}</b><div class="meta">${tab==='handouts'?esc(x.subject):tab==='students'?'ID: '+esc(x.id)+' · Password: '+esc(x.pass):esc(x.date)}</div></div>
  <div><button class="btn alt sm" onclick="editing='${x._id}';render();scrollTo(0,0)">Edit</button> <button class="btn del sm" onclick="delItem('${tab}','${x._id}')">Delete</button></div></div>`).join(''):`<div class="empty">No ${tab} yet. Use the form above to add one.</div>`}`;
}
function saveItem(k){
  const o={};CFG[k].fields.forEach(([f])=>o[f]=$('#f_'+f).value.trim());
  if(CFG[k].fields.some(([f])=>!o[f]))return toast('Fill in every field.');
  if(k==='handouts'&&!/^https?:\/\//i.test(o.link))return toast('The link must start with https://');
  if(k==='students'&&DB.students.some(s=>s.id.toLowerCase()===o.id.toLowerCase()&&s._id!==editing))return toast('That student ID already exists.');
  if(editing)Object.assign(DB[k].find(x=>x._id===editing),o);else DB[k].unshift({_id:uid(),date:today(),...o});
  editing=null;save();toast('Saved. Download data.json to publish.');
}
function delItem(k,id){if(confirm('Delete this '+CFG[k].one+'?')){DB[k]=DB[k].filter(x=>x._id!==id);save()}}
function saveSettings(){DB.settings={name:$('#s_name').value.trim()||'Northwest Campus Hub',welcome:$('#s_welcome').value.trim(),adminPass:$('#s_pass').value.trim()||'admin123'};save();toast('Settings saved.')}
function exportJSON(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DB,null,2)],{type:'application/json'}));a.download='data.json';a.click()}
function discard(){if(confirm('Throw away all changes not yet published?')){localStorage.removeItem('nwhub_draft');DB=base;render();toast('Changes discarded.')}}
$('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!d.settings||!d.students)throw 0;DB=d;save();toast('Imported.')}catch(x){toast('That file is not a valid data.json.')}});e.target.value=''};
init();
</script>
</body>
</html>
