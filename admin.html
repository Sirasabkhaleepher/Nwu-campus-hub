<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NWU Admin</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>body{font-family:Arial;background:#0f172a;color:white;padding:15px}.card{background:#1e293b;padding:20px;border-radius:15px;max-width:600px;margin:auto}input,select,textarea{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none}button{background:#2563eb;color:white;padding:12px;border:none;border-radius:8px;width:100%;font-weight:bold;cursor:pointer}</style>
</head><body>
<div class="card">
<h2>🎓 NWU Admin Panel</h2>
<p id="st">Checking...</p>
<div id="log"><input id="em" placeholder="Admin Email = Khaleephakabara@gmail.com"><input id="pw" type="password" placeholder="Password"><button onclick="login()">Login</button></div>
<div id="up" style="display:none">
<h3>Upload File (Use Google Drive Link)</h3>
<select id="level"><option>100L</option><option selected>200L</option><option>300L</option><option>400L</option></select>
<input id="course" placeholder="Course Code e.g. SEN201">
<input id="title" placeholder="Title e.g. Lecture 1 Note">
<textarea id="link" placeholder="Paste Google Drive share link"></textarea>
<button onclick="saveFile()">Save File to Students</button>
<textarea id="ann" placeholder="Announcement text" style="margin-top:20px"></textarea>
<button onclick="saveAnn()">Post Announcement</button>
<p id="msg"></p>
</div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyDGeRhDoDdJzxpyuo7zHg0L50D1Cc6jNmg",authDomain:"nwu-campus-hub.firebaseapp.com",projectId:"nwu-campus-hub",storageBucket:"nwu-campus-hub.firebasestorage.app",messagingSenderId:"1085860624193",appId:"1:1085860624193:web:368c85ba431d99ee2293c0"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(), db=firebase.firestore();
auth.onAuthStateChanged(u=>{if(u){st.innerText="Logged in: "+u.email;log.style.display='none';up.style.display='block';}else{st.innerText="Please login as Admin";}});
function login(){auth.signInWithEmailAndPassword(em.value,pw.value).then(()=>location.reload()).catch(e=>alert(e.message))}
function saveFile(){db.collection("files").add({level:level.value,course:course.value,title:title.value,url:link.value,createdAt:new Date()}).then(()=>{msg.innerText="✅ File Saved! Students can see it now";})}
function saveAnn(){db.collection("announcements").add({text:ann.value,createdAt:new Date()}).then(()=>{msg.innerText="✅ Announcement Posted!"})}
</script></body></html>
