<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NWU Campus Hub</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
body{font-family:Arial;margin:0;background:#f5f7ff}
header{background:#1e40af;color:white;padding:15px;text-align:center}
.card{background:white;margin:20px;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
button{background:#1e40af;color:white;border:none;padding:12px 20px;border-radius:8px;width:100%;margin-top:10px;font-size:16px}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}
</style>
</head>
<body>
<header><h1>🎓 NWU Campus Hub</h1><p>Northwest University Kano</p></header>
<div class="card">
<h2>Welcome!</h2>
<p id="status">Checking Firebase...</p>
<div id="authBox">
<input id="email" type="email" placeholder="Email (e.g. student@nwu.edu.ng)">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<button onclick="register()" style="background:#10b981">Register New Student</button>
</div>
</div>
<script>
function check(){
  if(typeof firebase !== 'undefined' && firebase.apps.length > 0){
    document.getElementById('status').innerHTML = "✅ Firebase Connected! Project: nwu-campus-hub<br>You can now Login/Register.";
  } else {
    document.getElementById('status').innerHTML = "❌ Firebase not connected. Check firebase-config.js";
  }
}
setTimeout(check, 1000);

function register(){
  const e=document.getElementById('email').value;
  const p=document.getElementById('password').value;
  firebase.auth().createUserWithEmailAndPassword(e,p)
  .then(()=>{alert("Account created! Now login");})
  .catch(err=>alert(err.message));
}
function login(){
  const e=document.getElementById('email').value;
  const p=document.getElementById('password').value;
  firebase.auth().signInWithEmailAndPassword(e,p)
  .then(()=>{alert("Logged in! Welcome to NWU Hub");})
  .catch(err=>alert(err.message));
}
</script>
</body>
</html>
